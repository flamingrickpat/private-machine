# Local chat and OpenRouter embeddings. Application defaults remain in config.example.yaml.
chat:
  Default:
    base_url: http://127.0.0.1:8080/v1
    model: qwen
    api_key: ""
    startup_script: ""
    # Discover serving tokens from /props. Remote services can set context_window.
    # Use 80% for project input; reserve the remainder for the response.
    context_input_fraction: 0.8
  UnitTestEvaluator:
    base_url: http://127.0.0.1:8080/v1
    model: qwen
    api_key: ""
    startup_script: ""
embedding:
  base_url: https://openrouter.ai/api/v1
  model: perplexity/pplx-embed-v1-0.6b
  response_model: pplx-embed-v1-0.6b
  api_key_env: OPENROUTER_API_KEY
  dimensions: 1024
  legacy_cache_dir: ~/.pm/embeddings
  cache_dir: .runtime/embeddings
# Optional Minecraft body (docs/subsystems/body-leases.md). Without this section the
# character has no body. With it pm probes the endpoint once at startup.
# minecraft:
#   mcp_url: http://127.0.0.1:6767/mcp
#   request_timeout_seconds: 660
#   probe_timeout_seconds: 5

# Optional operator limits for waits (docs/subsystems/inference-wait.md).
# cognitive_control:
#   post_reply_seconds: 600
#   wait_seconds: 1800
