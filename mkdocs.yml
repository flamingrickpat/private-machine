site_name: private-machine engineering manual
site_url: ""
use_directory_urls: false
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: grey
    accent: green
plugins:
  - search
  - gen-files:
      scripts:
        - dev/tools/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            show_if_no_docstring: true
            members: true
            docstring_style: null
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
