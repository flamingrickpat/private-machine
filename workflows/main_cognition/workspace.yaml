# Content requirements of the main cognition cycle (A19F).
# pm.records.workspace.load_workspace_requirements reads this file.
#
# Record names are Python record class names in pm/records.
# entity: self = about the companion, shard = about the entity of the shard,
#   group = about an entity of a current stimulus group, any = no filter.
# feature_type filters only Feature records.
# min_items reserves places. max_items and max_token_share are caps.
# max_token_share is a part of the shard content budget (WORKSPACE_SHARD_TOKENS).
#
# !!! ALPHA RUN ONLY: the max_items caps marked "ALPHA" are temporary. FIX PROPERLY LATER. !!!
# In the A19F review run the self shard held about 37 items and the user's
# shard about 44 after five ticks. The caps keep the story prefix small and
# stable for the owner run. The real fix is attention that also removes
# items (displacement and decay of incumbents), not a fixed count.
shards:
  self:
    requirements:
      - name: self_narrative
        select: {record: [Narrative], entity: self}
        min_items: 1
        max_items: 3
        max_token_share: 0.25
      - name: self_model
        select: {record: [SemanticRecord, BeliefRecord], entity: self}
        min_items: 1
        max_items: 6  # ALPHA
        max_token_share: 0.15
      # Goal records store entity id 0, so this selector has no entity filter.
      - name: self_goals
        select: {record: [Intention]}
        max_items: 6  # ALPHA
        max_token_share: 0.15
      - name: codelet_percepts
        select: {record: [CodeletPercept]}
        max_items: 10  # ALPHA
        max_token_share: 0.35
  entity:
    requirements:
      - name: entity_narrative
        select: {record: [Narrative], entity: shard}
        min_items: 1
        max_items: 2
        max_token_share: 0.2
      - name: memories
        select: {record: [MemoryClusterRecord, DeclarativeFactRecord, SemanticRecord], entity: shard}
        max_items: 12  # ALPHA
        max_token_share: 0.4
      - name: interpersonal_expectations
        select: {record: [ExpectationRecord, Intention], entity: shard}
        max_items: 6  # ALPHA
        max_token_share: 0.15
  workflow:
    requirements:
      - name: receipts
        select: {record: [ActionSchemaRecord, Feature], feature_type: WorldEvent}
        max_token_share: 0.4
      - name: world_memories
        select: {record: [WorldPlaceRecord, WorldObjectRecord, BodyEpisodeRecord]}
        max_token_share: 0.3

# Prune never removes a CSM item that matches one of these selectors.
csm:
  requirements:
    - name: current_stimuli
      select: {scope: current_stimuli}
    - name: self_narratives
      select: {record: [Narrative], entity: self}
    - name: group_narratives
      select: {record: [Narrative], entity: group}
