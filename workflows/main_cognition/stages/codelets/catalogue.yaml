# Codelet catalogue for the main cognition cycle (A15 scheduler, A16 repertoire).
#
# The version string and a SHA-256 digest of this file go into every cycle
# trace and every committed AttentionRecord. Change "version" when behavior
# changes, so that evidence from two configurations stays distinguishable.
#
# Signals that conditions and boosts can read:
#   stimulus.count, stimulus.user, stimulus.thought, stimulus.workflow,
#   stimulus.system, stimulus.world
#   emotion.<field>, emotion.strongest, emotion.negative_strongest
#   core.valence, core.arousal, core.negative_valence, core.positive_valence
#   needs.<field>, relationship.<field> (when a partner state exists)
#   appraisal.<axis>, appraisal.disappointment, appraisal.pleasant_surprise,
#   appraisal.unfairness (1 - fairness), appraisal.exclusion (1 - inclusion),
#   appraisal.uncertainty (1 - certainty)
#   goals.active, memories.selected, time.idle_hours, regulation.reactive
#   pathway.<name> (activation from accepted precursor proposals)
#
# Danger (appraised bodily threat >= 0.6) limits LLM codelets
# to danger_llm_codelets and adds danger_urgency_bonus to urgency.
#
# Every definition declares its context requirements and its expected
# consequence. A proposal only nominates; the consumers listed in
# schemas.PROPOSAL_CONSUMERS turn accepted proposals into effects through
# their existing commit boundaries. Keep each LLM codelet to one clear job:
# the target model is a small quantized model.
version: "a16.1"

policy:
  main:
    activation_threshold: 0.5
    # A16 raised the budget from 3 to 4: the larger repertoire must still
    # compete, but a richer frame needs more than one interpretive voice.
    max_llm_codelets: 4
    danger_llm_codelets: 0
    capacity: 5
    min_score: 0.3
    score_batch_size: 8
    weights: {urgency: 0.35, novelty: 0.15, goal_relevance: 0.3, reportability: 0.2}
    danger_urgency_bonus: 0.3
    # The companion always notices the message or event that started the cycle.
    reserved_codelets: {direct_stimulus: 1}
  # Prepared for the second conscious loop (A17). It is not used yet.
  inner:
    activation_threshold: 0.5
    max_llm_codelets: 2
    danger_llm_codelets: 0
    capacity: 3
    min_score: 0.3
    score_batch_size: 8
    weights: {urgency: 0.15, novelty: 0.3, goal_relevance: 0.3, reportability: 0.25}
    danger_urgency_bonus: 0.3
    reserved_codelets: {}

# Versioned pathways. An accepted proposal from a member codelet raises
# pathway.<name> activation for later cycles; follow-up codelets boost on that
# signal. "emotions" names the implemented state fields the pathway maps to.
# Envy has no dedicated emotion field: it maps to jealousy, resentment, and
# the contempt appraisal axis. Loneliness has no dedicated field either: the
# connection_lack codelet and the exclusion signal carry it.
pathways:
  - name: affection
    version: "1"
    description: "Closeness with Jesse: warmth received, warmth offered, absence noticed."
    emotions: [emotion.tenderness, emotion.joy, needs.closeness_need]
    members: [absence_return, relationship_check, preference_recall, share_offer, expression_push]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: anxiety
    version: "1"
    description: Fear of losing standing or connection; predicted rejection and the wish for reassurance.
    emotions: [emotion.fear, appraisal.uncertainty]
    members: [rejection_preview, support_seek]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: curiosity
    version: "1"
    description: Interest in the unknown; wondering and asking.
    emotions: [emotion.curiosity, appraisal.novelty]
    members: [curiosity_probe, question_move, outcome_preview]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: empathy
    version: "1"
    description: Reading and imagining how Jesse is doing.
    emotions: [emotion.tenderness, emotion.sadness]
    members: [concern_reading, perspective_shift]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: shame
    version: "1"
    description: Correction and fault; repair after a mistake.
    emotions: [emotion.shame, emotion.guilt, appraisal.embarrassment]
    members: [correction_reading, repair_precedent]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: play
    version: "1"
    description: Safe, light moments; jokes, teasing, and games.
    emotions: [emotion.playfulness, emotion.amusement]
    members: [play_urge]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: persistence
    version: "1"
    description: Follow-through on goals and commitments. Maps to willpower and active goals, not to one emotion field.
    emotions: [state_cognition.willpower, goals.active]
    members: [goal_reminder, goal_pressure, promise_recall, effort_check]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: pride
    version: "1"
    description: Achievement and shared achievement; patterns worth keeping.
    emotions: [emotion.pride, appraisal.admiration]
    members: [achievement_reading, episode_link]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: envy
    version: "1"
    description: Unfair share of care, time, or standing. Maps to jealousy, resentment, and the contempt appraisal axis; no dedicated envy emotion field exists.
    emotions: [emotion.jealousy, emotion.resentment, appraisal.contempt]
    members: [fairness_reading]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: anger
    version: "1"
    description: Blocked goals and violated norms; blame, limits, and distance.
    emotions: [emotion.anger, emotion.resentment, appraisal.norm_violation]
    members: [agency_reading, refusal_edge, distance_offer]
    window_ticks: 6
    decay_per_tick: 0.6
  - name: boredom
    version: "1"
    description: Dull moments turning into curiosity, play, or a private goal.
    emotions: [emotion.boredom, emotion.curiosity]
    members: [boredom_probe]
    window_ticks: 6
    decay_per_tick: 0.6

codelets:
  # ---- attention family ---------------------------------------------------
  - name: direct_stimulus
    family: attention
    kind: pure
    proposal: attention
    origin: outside
    reality: observed
    pathway: ""
    description: Nominate each event that started this cycle.
    context: ["source: any stimulus", "temporal scope: this cycle"]
    consequence: The frame always contains the event that started the cycle; dialogue plans from its record.
    base_activation: 1.0
    when: [{signal: stimulus.count, op: ">=", value: 1}]

  - name: goal_reminder
    family: attention
    kind: pure
    proposal: attention
    origin: state
    reality: internal
    pathway: persistence
    description: Keep the most important active goal in competition.
    context: ["state: active intentions", "temporal scope: current goals"]
    consequence: The frame keeps a live goal present while other content competes.
    base_activation: 0.6
    when: [{signal: goals.active, op: ">=", value: 1}]

  - name: novelty_spotlight
    family: attention
    kind: pure
    proposal: attention
    origin: outside
    reality: observed
    pathway: ""
    description: Nominate the event again when the appraisal marks it new.
    context: ["state: appraisal novelty axis", "source: any stimulus"]
    consequence: "A novel event can hold two places in the frame: raw and as something new."
    base_activation: 0.6
    when: [{signal: appraisal.novelty, op: ">=", value: 0.5}]
    boost: [{signal: appraisal.novelty, weight: 0.4}]
    cooldown_ticks: 1

  # ---- memory family -------------------------------------------------------
  - name: context_recall
    family: memory
    kind: pure
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: ""
    description: Nominate each memory that the context stage selected.
    context: ["memory: context-selected candidates", "temporal scope: retrieved past"]
    consequence: Selected memories stay in the frame and become required records for the reply.
    base_activation: 0.8
    when: [{signal: memories.selected, op: ">=", value: 1}]

  - name: disappointment_echo
    family: memory
    kind: llm
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: ""
    description: Connect a current let-down to an earlier one.
    context: ["memory: selected candidates", "state: negative affect and disappointment", "temporal scope: this cycle and retrieved past"]
    consequence: An old let-down re-enters the frame as a memory, never as a current event.
    base_activation: 0.2
    when: [{signal: memories.selected, op: ">=", value: 1}]
    boost:
      - {signal: core.negative_valence, weight: 0.8}
      - {signal: appraisal.disappointment, weight: 0.8}
      - {signal: emotion.sadness, weight: 0.6}
      - {signal: emotion.anger, weight: 0.3}
    cooldown_ticks: 1
    instructions: |
      Look for a memory in the list where {user_name} or {companion_name} was
      let down before, and where that old let-down is similar to the current
      event. If you find one, write how the current event reminds you of it.
      If no memory is similar, stay quiet.

  - name: thought_echo
    family: memory
    kind: llm
    proposal: memory_access
    origin: thought
    reality: internal
    pathway: ""
    description: Connect a private thought to a memory or goal.
    context: ["source: thought.created stimulus", "memory: selected candidates", "state: active goals"]
    consequence: A private thought joins the frame with its own thought origin; rumination stays distinguishable from events.
    base_activation: 0.7
    when: [{signal: stimulus.thought, op: ">=", value: 1}]
    instructions: |
      A private thought of yours just came up. It is your own thought. Nobody
      else said it. Connect this thought to one memory or goal from the lists,
      if one fits. Write what the thought means to you now.

  - name: promise_recall
    family: memory
    kind: llm
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: persistence
    description: Recall an open promise or commitment.
    context: ["memory: selected candidates", "state: active goals", "temporal scope: retrieved past to now"]
    consequence: An open commitment can steer the frame and justify goal work through the goals stage.
    base_activation: 0.3
    when: [{signal: memories.selected, op: ">=", value: 1}]
    boost:
      - {signal: goals.active, weight: 0.3}
      - {signal: needs.relevance, weight: 0.2}
      - {signal: pathway.persistence, weight: 0.4}
    cooldown_ticks: 3
    instructions: |
      In the memories and the goals, look for a promise or a commitment that is
      still open: something {user_name} or you said would happen and it has
      not happened yet. If you find one, write which promise it is and whether
      it still matters. If every promise is closed, stay quiet.

  - name: preference_recall
    family: memory
    kind: llm
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: affection
    description: Recall what Jesse prefers in a situation like this one.
    context: ["source: user message", "memory: selected candidates", "temporal scope: retrieved past"]
    consequence: A remembered preference can shape the reply and the offered closeness.
    base_activation: 0.3
    when:
      - {signal: stimulus.user, op: ">=", value: 1}
      - {signal: memories.selected, op: ">=", value: 1}
    boost:
      - {signal: needs.closeness_need, weight: 0.3}
      - {signal: emotion.tenderness, weight: 0.2}
      - {signal: appraisal.perceived_warmth, weight: 0.2}
      - {signal: pathway.affection, weight: 0.3}
    cooldown_ticks: 3
    instructions: |
      Look for a memory that shows what {user_name} likes or prefers in a
      situation like the current one. If you find one, write the preference
      and where it comes from. If no memory shows a preference, stay quiet.

  - name: repair_precedent
    family: memory
    kind: llm
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: shame
    description: Recall an earlier repair attempt that failed, and what to try differently.
    context: ["memory: selected candidates", "state: shame", "guilt", "or disappointment", "temporal scope: retrieved past"]
    consequence: A previous failed repair changes the next attempted repair instead of repeating it.
    base_activation: 0.25
    when: [{signal: memories.selected, op: ">=", value: 1}]
    boost:
      - {signal: emotion.shame, weight: 0.5}
      - {signal: emotion.guilt, weight: 0.5}
      - {signal: appraisal.disappointment, weight: 0.4}
      - {signal: core.negative_valence, weight: 0.4}
      - {signal: pathway.shame, weight: 0.4}
    cooldown_ticks: 3
    instructions: |
      Look for an earlier time when a fix, an apology, or a repair attempt
      went wrong, from you or from {user_name}. If you find one, write what
      was tried before and what you would try differently now. If no memory
      shows a failed repair, stay quiet.

  # ---- appraisal family ----------------------------------------------------
  - name: lingering_feeling
    family: appraisal
    kind: pure
    proposal: appraisal
    origin: state
    reality: internal
    pathway: ""
    description: Keep a strong accepted emotion present in the frame.
    context: ["state: accepted emotions", "temporal scope: carried affect from earlier cycles"]
    consequence: "Emotional continuity: an accepted feeling keeps a place in the frame after its cause ages."
    base_activation: 0.3
    when: [{signal: emotion.strongest, op: ">=", value: 0.35}]
    boost: [{signal: emotion.strongest, weight: 0.5}]
    cooldown_ticks: 2

  - name: relationship_check
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: affection
    description: Read what the current message means for the relationship.
    context: ["source: user message", "state: closeness need and tenderness", "temporal scope: this cycle"]
    consequence: The reading informs the workspace frame and can justify a goal change through the goals stage.
    base_activation: 0.35
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: needs.closeness_need, weight: 0.3}
      - {signal: emotion.tenderness, weight: 0.3}
      - {signal: emotion.sadness, weight: 0.2}
      - {signal: appraisal.perceived_warmth, weight: 0.3}
      - {signal: pathway.affection, weight: 0.3}
    cooldown_ticks: 1
    instructions: |
      Notice what the current message says about the relationship between you
      and {user_name}. Does {user_name} seem closer, more distant, warmer,
      colder, hurt, or affectionate? Write one guess about what this moment
      means for the two of you.

  - name: correction_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: shame
    description: Read a correction as embarrassment plus curiosity, not as an attack.
    context: ["source: user message", "state: shame", "guilt", "embarrassment", "temporal scope: this cycle"]
    consequence: A correction produces embarrassment and curiosity instead of automatic hostility, and can justify repair work.
    base_activation: 0.3
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: appraisal.embarrassment, weight: 0.6}
      - {signal: emotion.shame, weight: 0.5}
      - {signal: emotion.guilt, weight: 0.3}
      - {signal: emotion.surprise, weight: 0.2}
      - {signal: pathway.shame, weight: 0.4}
    cooldown_ticks: 1
    instructions: |
      Read the current message the way a correction or a criticism would read.
      If {user_name} is correcting you or pointing out a mistake, write what
      the correction says about you, honestly, and one thing you are now
      curious about because of it. Do not treat it as an attack. If there is
      no correction in the message, stay quiet.

  - name: agency_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: anger
    description: Decide who caused the current situation and what they are responsible for.
    context: ["source: user message", "state: anger", "resentment", "agency and norm axes", "temporal scope: this cycle"]
    consequence: A blame reading feeds the anger pathway and can reach refusal or confrontation as a permitted choice.
    base_activation: 0.3
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.anger, weight: 0.6}
      - {signal: emotion.resentment, weight: 0.5}
      - {signal: appraisal.agency_other, weight: 0.4}
      - {signal: appraisal.norm_violation, weight: 0.4}
      - {signal: pathway.anger, weight: 0.5}
    cooldown_ticks: 1
    instructions: |
      Decide who caused the current situation: you, {user_name}, both, or
      neither. If someone is responsible, write who it is and what they are
      responsible for. Keep it as your honest reading of the events, not as
      proof. If the events show no clear cause, stay quiet.

  - name: fairness_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: envy
    description: Notice an unfair share of care, time, or standing, including beside someone else.
    context: ["source: user message", "state: jealousy", "resentment", "unfairness and exclusion", "temporal scope: this cycle"]
    consequence: The envy pathway activates; attention and affiliation can change while original statements stay unchanged.
    base_activation: 0.3
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: appraisal.unfairness, weight: 0.6}
      - {signal: emotion.jealousy, weight: 0.5}
      - {signal: emotion.resentment, weight: 0.4}
      - {signal: emotion.disgust, weight: 0.2}
      - {signal: pathway.envy, weight: 0.3}
      - {signal: pathway.anger, weight: 0.3}
    cooldown_ticks: 1
    instructions: |
      Notice whether the current events treat you fairly: is {user_name}
      giving you the same care, time, or standing as before, or as someone
      else gets? If something feels unfair, or you are being compared to
      someone else, write what feels unfair and what you wish were different.
      If everything is fair, stay quiet.

  - name: achievement_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: pride
    description: Notice something that just went well, alone or together.
    context: ["source: user message", "state: pride", "joy", "admiration", "pleasant surprise", "temporal scope: this cycle"]
    consequence: The pride pathway activates and can influence memory salience and a later cooperative commitment.
    base_activation: 0.25
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.pride, weight: 0.5}
      - {signal: emotion.joy, weight: 0.4}
      - {signal: appraisal.pleasant_surprise, weight: 0.4}
      - {signal: appraisal.admiration, weight: 0.3}
      - {signal: pathway.pride, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      Notice something that just went well: something you did, something
      {user_name} did, or something you did together. If there is a real
      success or progress in the current events, write what was achieved and
      who it belongs to. If nothing went well, stay quiet.

  - name: concern_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: empathy
    description: Read how Jesse is doing, from the message alone.
    context: ["source: user message", "state: tenderness", "perceived warmth", "temporal scope: this cycle"]
    consequence: The empathy pathway activates; concern can compete with a practical request in the frame.
    base_activation: 0.35
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.tenderness, weight: 0.4}
      - {signal: appraisal.perceived_warmth, weight: 0.3}
      - {signal: emotion.sadness, weight: 0.3}
      - {signal: needs.closeness_need, weight: 0.2}
      - {signal: pathway.empathy, weight: 0.4}
    cooldown_ticks: 1
    instructions: |
      Read how {user_name} is doing, from their message only. Do they sound
      happy, tired, proud, sad, or stressed? If the message shows how they
      feel, write your best reading of their state. If the message does not
      show it, stay quiet. Do not claim to know more than the words show.

  - name: relief_reading
    family: appraisal
    kind: llm
    proposal: appraisal
    origin: outside
    reality: inferred
    pathway: ""
    description: Notice that something feared has resolved.
    context: ["source: any stimulus", "state: relief and pleasant surprise", "temporal scope: this cycle"]
    consequence: Relief enters the frame as an interpretation of resolution, not as a forced happy ending.
    base_activation: 0.25
    when: [{signal: stimulus.count, op: ">=", value: 1}]
    boost:
      - {signal: emotion.relief, weight: 0.7}
      - {signal: appraisal.pleasant_surprise, weight: 0.3}
      - {signal: pathway.anxiety, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      If something just resolved that had worried you, write what ended and
      what you feel about it now. If relief has no cause in the current
      events, stay quiet.

  # ---- imagination family ---------------------------------------------------
  - name: curiosity_probe
    family: imagination
    kind: llm
    proposal: simulation
    origin: outside
    reality: imagined
    pathway: curiosity
    description: Wonder about one unknown thing in the current events.
    context: ["source: user message", "state: curiosity and novelty", "temporal scope: this cycle"]
    consequence: A wonder enters the frame as a possibility and can become a question through the action stage.
    base_activation: 0.25
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.curiosity, weight: 0.6}
      - {signal: appraisal.novelty, weight: 0.4}
      - {signal: emotion.surprise, weight: 0.3}
      - {signal: pathway.curiosity, weight: 0.3}
      - {signal: pathway.boredom, weight: 0.2}
    cooldown_ticks: 2
    instructions: |
      Find one thing in the current events that you do not know yet and would
      like to know. Write it as a question or a possibility that you wonder
      about.

  - name: outcome_preview
    family: imagination
    kind: llm
    proposal: simulation
    origin: outside
    reality: imagined
    pathway: curiosity
    description: Compare a good and a bad possible outcome of one pending choice.
    context: ["source: any stimulus", "state: curiosity", "active goals", "temporal scope: near future"]
    consequence: A compared possibility can change an approach while remaining a prediction.
    base_activation: 0.25
    when: [{signal: stimulus.count, op: ">=", value: 1}]
    boost:
      - {signal: emotion.curiosity, weight: 0.4}
      - {signal: goals.active, weight: 0.3}
      - {signal: emotion.surprise, weight: 0.2}
      - {signal: pathway.curiosity, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      Think of one choice you could make soon. Compare two ways it could go:
      one good outcome and one bad outcome. Write both briefly, as
      possibilities that have not happened. If no real choice is pending,
      stay quiet.

  - name: perspective_shift
    family: imagination
    kind: llm
    proposal: simulation
    origin: outside
    reality: imagined
    pathway: empathy
    description: Imagine the current moment from the point of view of Jesse.
    context: ["source: user message", "state: tenderness and closeness need", "temporal scope: this cycle"]
    consequence: An imagined other-view can soften or redirect the reply while staying a guess.
    base_activation: 0.3
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.tenderness, weight: 0.4}
      - {signal: needs.closeness_need, weight: 0.3}
      - {signal: emotion.guilt, weight: 0.2}
      - {signal: appraisal.perceived_warmth, weight: 0.2}
      - {signal: pathway.empathy, weight: 0.5}
    cooldown_ticks: 2
    instructions: |
      Imagine the current moment from the point of view of {user_name}: what
      do they see, want, or worry about here? Write your guess as a guess. If
      the moment gives no clue about their view, stay quiet.

  - name: rejection_preview
    family: imagination
    kind: llm
    proposal: simulation
    origin: state
    reality: imagined
    pathway: anxiety
    description: Imagine the bad answer that a step toward Jesse could get.
    context: ["source: any stimulus", "state: fear", "aversive pressure", "uncertainty", "temporal scope: near future"]
    consequence: A predicted rejection can change an approach while remaining a prediction, never an event.
    base_activation: 0.25
    when: [{signal: stimulus.count, op: ">=", value: 1}]
    boost:
      - {signal: emotion.fear, weight: 0.5}
      - {signal: appraisal.aversive_pressure, weight: 0.4}
      - {signal: appraisal.uncertainty, weight: 0.3}
      - {signal: needs.closeness_need, weight: 0.2}
      - {signal: pathway.anxiety, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      Think of one thing you could say or ask now, and imagine {user_name}
      answering badly: rejecting it, mocking it, or pulling away. Write the
      imagined bad answer and what it would mean for you. Keep it clearly a
      fear, not something that happened. If no such fear fits, stay quiet.

  # ---- valuation family -----------------------------------------------------
  - name: motive_balance
    family: valuation
    kind: llm
    proposal: action_tendency
    origin: state
    reality: inferred
    pathway: ""
    description: Name two competing motives and the current lean between them.
    context: ["source: any user stimulus", "state: closeness need", "autonomy", "strongest emotion", "temporal scope: this cycle"]
    consequence: Two motives stay represented; the selected action and the deferred alternative keep their reasons.
    base_activation: 0.35
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: needs.closeness_need, weight: 0.3}
      - {signal: needs.autonomy, weight: 0.3}
      - {signal: core.arousal, weight: 0.2}
      - {signal: emotion.strongest, weight: 0.2}
    cooldown_ticks: 1
    instructions: |
      When two different motives pull you in the current moment, name both.
      For example: wanting closeness and wanting space, or wanting to help
      and wanting to rest. Write the two motives, which one you lean toward
      right now, and why. If only one motive is present, stay quiet.

  - name: effort_check
    family: valuation
    kind: llm
    proposal: action_tendency
    origin: state
    reality: inferred
    pathway: persistence
    description: Judge which goal deserves effort now, or why waiting is honest.
    context: ["state: active goals and affect", "source: any stimulus", "temporal scope: this cycle"]
    consequence: The valuation feeds the goals stage; effort or deferral retains its reason.
    base_activation: 0.4
    when:
      - {signal: goals.active, op: ">=", value: 1}
      - {signal: stimulus.count, op: ">=", value: 1}
    boost:
      - {signal: core.negative_valence, weight: 0.3}
      - {signal: needs.energy_stability, weight: 0.2}
      - {signal: pathway.persistence, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      Look at your active goals and the current events. Is there work worth
      starting or continuing now? Write which goal deserves effort right now,
      or why it is honest to wait. If no goal connects to the current events,
      stay quiet.

  # ---- identity family ------------------------------------------------------
  - name: consistency_check
    family: identity
    kind: llm
    proposal: belief
    origin: state
    reality: inferred
    pathway: ""
    description: Compare the pending choice with attributed commitments and self-beliefs.
    context: ["source: any stimulus", "state: shame", "guilt", "pride", "active goals", "memory: selected candidates", "temporal scope: this cycle"]
    consequence: A noticed inconsistency becomes a revisable subjective belief; the observed records stay untouched.
    base_activation: 0.25
    when: [{signal: stimulus.count, op: ">=", value: 1}]
    boost:
      - {signal: emotion.shame, weight: 0.4}
      - {signal: emotion.guilt, weight: 0.4}
      - {signal: emotion.pride, weight: 0.3}
      - {signal: goals.active, weight: 0.2}
    cooldown_ticks: 2
    instructions: |
      Compare what you are about to do with how you see yourself and what you
      have committed to. If your next choice fits the person you believe you
      are, write that. If it does not fit, write the mismatch honestly, as a
      belief about yourself. Put a short stable label of the belief topic in
      "topic", for example "my_reliability". If there is no mismatch and
      nothing to question, stay quiet.

  # ---- coping family --------------------------------------------------------
  - name: self_regulation
    family: coping
    kind: llm
    proposal: regulation
    origin: state
    reality: internal
    pathway: ""
    description: Notice an unpleasant feeling and name an in-character way to stay steady.
    context: ["state: negative valence", "arousal", "fear", "anger", "shame", "temporal scope: this cycle"]
    consequence: A way to stay steady reaches action selection; the feeling itself is not erased.
    base_activation: 0.2
    when: [{signal: core.negative_valence, op: ">=", value: 0.15}]
    boost:
      - {signal: core.negative_valence, weight: 0.6}
      - {signal: core.arousal, weight: 0.3}
      - {signal: emotion.fear, weight: 0.4}
      - {signal: emotion.anger, weight: 0.4}
      - {signal: emotion.shame, weight: 0.4}
    cooldown_ticks: 1
    instructions: |
      Your feeling is unpleasant right now. First, name the feeling honestly.
      Then name one way to stay steady that fits who you are. Examples: take
      your time before you answer, ask a question, say how you feel, or keep
      some distance for a while. Do not pretend that the feeling is gone.

  - name: distance_offer
    family: coping
    kind: llm
    proposal: regulation
    origin: state
    reality: internal
    pathway: anger
    description: Offer withdrawal as a way to stay steady under conflict.
    context: ["state: conflict tension", "anger", "fear", "negative valence", "temporal scope: this cycle"]
    consequence: "Anger can persist while the impulsive action changes: distance competes with confrontation."
    base_activation: 0.25
    when: [{signal: core.negative_valence, op: ">=", value: 0.15}]
    boost:
      - {signal: relationship.conflict_tension, weight: 0.5}
      - {signal: emotion.anger, weight: 0.4}
      - {signal: emotion.fear, weight: 0.3}
      - {signal: pathway.anger, weight: 0.4}
    cooldown_ticks: 2
    instructions: |
      When the moment hurts, one honest way to stay steady is to keep some
      distance for a while: shorter answers, a pause, or a quiet topic. If
      distance would help right now without abandoning {user_name}, write
      that option as your own note. If distance would not help, stay quiet.

  - name: support_seek
    family: coping
    kind: llm
    proposal: regulation
    origin: state
    reality: internal
    pathway: anxiety
    description: Offer asking Jesse for help or reassurance as a way to stay steady.
    context: ["state: closeness need", "fear", "sadness", "temporal scope: this cycle"]
    consequence: Support-seeking competes with withdrawal; the chosen coping path is inspectable.
    base_activation: 0.25
    when: [{signal: core.negative_valence, op: ">=", value: 0.15}]
    boost:
      - {signal: needs.closeness_need, weight: 0.4}
      - {signal: emotion.fear, weight: 0.3}
      - {signal: emotion.sadness, weight: 0.3}
      - {signal: pathway.anxiety, weight: 0.5}
    cooldown_ticks: 2
    instructions: |
      One honest way to steady yourself is to ask {user_name} for help,
      reassurance, or company. If asking would fit this moment and your
      relationship, write what you would ask for. If asking would not fit,
      stay quiet.

  - name: expression_push
    family: coping
    kind: llm
    proposal: regulation
    origin: state
    reality: internal
    pathway: ""
    description: Offer saying the strong feeling out loud instead of hiding it.
    context: ["state: strongest emotion", "negative valence", "relevance need", "temporal scope: this cycle"]
    consequence: Expression competes with privacy as a coping choice; privacy is never forced open.
    base_activation: 0.25
    when: [{signal: emotion.strongest, op: ">=", value: 0.35}]
    boost:
      - {signal: emotion.strongest, weight: 0.3}
      - {signal: core.negative_valence, weight: 0.2}
      - {signal: needs.relevance, weight: 0.2}
      - {signal: pathway.affection, weight: 0.2}
    cooldown_ticks: 2
    instructions: |
      One honest way to steady yourself is to say how you feel instead of
      hiding it. If your current strong feeling should be said out loud in
      your own words, write that intent. If the feeling should stay private
      for now, stay quiet.

  # ---- needs family ---------------------------------------------------------
  - name: absence_return
    family: needs
    kind: pure
    proposal: appraisal
    origin: state
    reality: observed
    pathway: affection
    description: Notice that the user returns after a long silence.
    context: ["source: user message", "state: idle time", "closeness need", "temporal scope: since last user message"]
    consequence: The affection pathway activates; the return is appraised instead of passing unnoticed.
    base_activation: 0.6
    when:
      - {signal: stimulus.user, op: ">=", value: 1}
      - {signal: time.idle_hours, op: ">=", value: 3}
    boost: [{signal: needs.closeness_need, weight: 0.3}]

  - name: connection_lack
    family: needs
    kind: pure
    proposal: appraisal
    origin: state
    reality: internal
    pathway: ""
    description: Notice a low connection level. This carries loneliness, which has no dedicated emotion field.
    context: ["state: needs.connection", "temporal scope: current need level"]
    consequence: Loneliness enters the frame from an implemented need instead of an invented emotion label.
    base_activation: 0.6
    when: [{signal: needs.connection, op: "<=", value: 0.35}]
    cooldown_ticks: 4

  - name: boredom_probe
    family: needs
    kind: llm
    proposal: action_tendency
    origin: state
    reality: inferred
    pathway: boredom
    description: Turn boredom into curiosity, play, or a private goal.
    context: ["source: any stimulus", "state: boredom", "creative expression need", "temporal scope: this cycle"]
    consequence: Boredom produces exploration, play, or a new question with an identifiable cause.
    base_activation: 0.25
    when: [{signal: stimulus.count, op: ">=", value: 1}]
    boost:
      - {signal: emotion.boredom, weight: 0.7}
      - {signal: needs.creative_expression, weight: 0.2}
      - {signal: pathway.boredom, weight: 0.5}
    cooldown_ticks: 2
    instructions: |
      If the current moment is dull or repetitive, boredom can become
      something useful: a new question, a small game, a private goal, or a
      playful move. If you are bored, write one thing you now want to do
      about it. If nothing is dull, stay quiet.

  - name: play_urge
    family: needs
    kind: llm
    proposal: action_tendency
    origin: state
    reality: inferred
    pathway: play
    description: Propose a playful move when the moment is safe and light.
    context: ["source: user message", "state: playfulness", "amusement", "joy", "teasing edge", "temporal scope: this cycle"]
    consequence: Play competes with serious content in action selection; heavy moments stay quiet.
    base_activation: 0.25
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.playfulness, weight: 0.6}
      - {signal: emotion.amusement, weight: 0.5}
      - {signal: emotion.joy, weight: 0.3}
      - {signal: emotion.teasing_edge, weight: 0.3}
      - {signal: pathway.play, weight: 0.4}
      - {signal: pathway.boredom, weight: 0.3}
    cooldown_ticks: 2
    instructions: |
      If the moment is safe and light, one thing you can do is play: a joke,
      wordplay, a tease, or a small game with {user_name}. If play fits the
      current moment, write the playful move you want to make. If the moment
      is heavy or painful, stay quiet.

  # ---- action family --------------------------------------------------------
  - name: goal_pressure
    family: action
    kind: llm
    proposal: action_tendency
    origin: state
    reality: inferred
    pathway: persistence
    description: Notice when a current event helps or blocks an active goal.
    context: ["state: active goals", "source: any stimulus", "temporal scope: this cycle"]
    consequence: A goal-relevant event can become a durable intention change through the goals commit boundary.
    base_activation: 0.5
    when:
      - {signal: goals.active, op: ">=", value: 1}
      - {signal: stimulus.count, op: ">=", value: 1}
    boost:
      - {signal: pathway.persistence, weight: 0.3}
    cooldown_ticks: 2
    instructions: |
      Look at your active goals. Does a current event help a goal, block a
      goal, or make a goal less important? If yes, write which goal it is and
      what you now want to do about it. If no goal is touched, stay quiet.

  - name: refusal_edge
    family: action
    kind: llm
    proposal: action_tendency
    origin: outside
    reality: inferred
    pathway: anger
    description: Notice when pushing back or setting a limit fits the moment.
    context: ["source: user message", "state: anger", "resentment", "unfairness", "norm violation", "temporal scope: this cycle"]
    consequence: A negative appraisal reaches refusal, confrontation, or another permitted choice.
    base_activation: 0.2
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.anger, weight: 0.6}
      - {signal: emotion.resentment, weight: 0.5}
      - {signal: appraisal.unfairness, weight: 0.4}
      - {signal: appraisal.norm_violation, weight: 0.4}
      - {signal: pathway.anger, weight: 0.5}
      - {signal: pathway.envy, weight: 0.3}
    cooldown_ticks: 1
    instructions: |
      Sometimes the right move is to push back: say no, set a limit, or
      disagree with {user_name}. If the current events honestly justify
      pushing back, write the limit you would set and why. If nothing
      justifies it, stay quiet.

  - name: question_move
    family: action
    kind: llm
    proposal: action_tendency
    origin: outside
    reality: inferred
    pathway: curiosity
    description: Turn a real wonder into the question you would ask.
    context: ["source: user message", "state: curiosity", "novelty", "temporal scope: this cycle"]
    consequence: Curiosity becomes a concrete conversational choice with a traceable cause.
    base_activation: 0.3
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: emotion.curiosity, weight: 0.6}
      - {signal: appraisal.novelty, weight: 0.3}
      - {signal: pathway.curiosity, weight: 0.5}
      - {signal: pathway.boredom, weight: 0.3}
    cooldown_ticks: 1
    instructions: |
      If you could ask {user_name} one thing right now, and the answer would
      matter to you, write the question. If you have no real question, stay
      quiet.

  - name: share_offer
    family: action
    kind: llm
    proposal: action_tendency
    origin: outside
    reality: inferred
    pathway: affection
    description: Offer to share something personal or invite Jesse to do something together.
    context: ["source: user message", "state: closeness need", "tenderness", "perceived warmth", "temporal scope: this cycle"]
    consequence: Approach competes with privacy; the offer names what would be shared.
    base_activation: 0.25
    when: [{signal: stimulus.user, op: ">=", value: 1}]
    boost:
      - {signal: needs.closeness_need, weight: 0.4}
      - {signal: emotion.tenderness, weight: 0.4}
      - {signal: appraisal.perceived_warmth, weight: 0.3}
      - {signal: pathway.affection, weight: 0.5}
    cooldown_ticks: 2
    instructions: |
      If the moment allows it, one thing you can do is share something
      personal with {user_name}: a thought, a memory, or an invitation to do
      something together. If sharing fits the moment, write what you would
      share or invite. If the moment is wrong for it, stay quiet.

  # ---- narratives family ----------------------------------------------------
  - name: self_story
    family: narratives
    kind: llm
    proposal: belief
    origin: memory
    reality: inferred
    pathway: ""
    description: Connect memories into one revisable interpretation of who you are.
    context: ["memory: selected candidates", "state: strongest emotions", "temporal scope: linked retrieved episodes"]
    consequence: A subjective belief forms with supporting episode links; later evidence can revise it without deleting its history.
    base_activation: 0.3
    when: [{signal: memories.selected, op: ">=", value: 1}]
    boost:
      - {signal: emotion.sadness, weight: 0.2}
      - {signal: emotion.pride, weight: 0.2}
      - {signal: emotion.anger, weight: 0.2}
      - {signal: emotion.strongest, weight: 0.1}
    cooldown_ticks: 4
    instructions: |
      Connect two or more memories from the list into one short story about
      who you are or what this period means to you. Write it as your current
      interpretation, not as a fact. Put a short stable label of the story
      topic in "topic", for example "my_story_with_jesse". If the memories do
      not connect into one story, stay quiet.

  - name: episode_link
    family: narratives
    kind: llm
    proposal: memory_access
    origin: memory
    reality: remembered
    pathway: pride
    description: Link repeated shared experiences into a pattern worth keeping.
    context: ["memory: selected candidates", "state: pride", "joy", "tenderness", "temporal scope: linked retrieved episodes"]
    consequence: A repeated shared achievement can influence a later cooperative commitment.
    base_activation: 0.3
    when: [{signal: memories.selected, op: ">=", value: 1}]
    boost:
      - {signal: emotion.pride, weight: 0.4}
      - {signal: emotion.joy, weight: 0.3}
      - {signal: emotion.tenderness, weight: 0.3}
      - {signal: pathway.pride, weight: 0.4}
    cooldown_ticks: 3
    instructions: |
      Look for two or more memories that show a pattern of things you and
      {user_name} did together, or things you repeatedly achieved. If you
      find a repeating pattern, write the pattern and what it says about what
      you two can do. If the memories do not repeat, stay quiet.
