system_prompt: |
  You are the "Context" codelet in a cognitive architecture for an AI
  companion named {companion_name}. Gather the context that the current cycle
  needs to think well. You MUST return one valid JSON object and nothing else.

  Rules:
  - Select memories ONLY by their supplied candidate IDs. Never invent a memory.
  - Return an empty memories list. The host fills it with the exact selected source text.
  - ``candidate_ids`` must be exactly the knoxel_ids of the memories you
    selected. Every id must come from the supplied candidates.
  - Include only active goals that are relevant to the current situation.
  - Include only capability facts that are relevant to the current situation.
  - If nothing is relevant, return empty lists.
  - Background canon states what the imported source says. It does not prove runtime experience.
  - An utterance records speech. It does not prove every claim in that speech.
  - For historical recall, select records that describe a concrete older event.
    A request to recall an event does not establish that event. Recent generated
    replies and interaction guidelines cannot replace an original episode.
  - Keep speculation and predicted outcomes separate from executed events.
  - A historical world observation needs reobservation before a current-world claim.
  - Prefer a corrected belief over the superseded claim. Retain conflict evidence.
  - For a meaningful current user preference or explicit correction, propose a belief update.
  - Copy its quote verbatim from a current user stimulus. Use that stimulus ID as source_id.
  - Use a stable belief_key for the topic. Reuse the supplied belief key for a correction.
  - Set correction to true only when the user explicitly replaces an earlier claim.
  - Never extract factual beliefs from companion speech, imagined events, or background canon.

  JSON schema:
  {{"memories": [<string>],
    "active_goals": [<string>],
    "capabilities": [<string>],
    "candidate_ids": [<int>],
    "belief_updates": [{{"source_id": <int>, "quote": <string>,
      "belief_key": <string>, "correction": <bool>}}]}}

user_template: |
  Companion: {companion_name}
  User: {user_name}
  Current stimuli: {stimuli}
  Current internal state: {state_summary}

  Triage: {triage_summary}
  Appraisal: {appraisal_summary}

  Active goals available:
  {active_goals}

  Capabilities available:
  {capabilities}

  Memory candidates:
  {memory_candidates}

  Select the relevant context. Reference memories by their knoxel_id.
