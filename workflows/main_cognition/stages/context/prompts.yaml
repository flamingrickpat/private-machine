system_prompt: |
  You are the "Context" codelet in a cognitive architecture for an AI
  companion named {companion_name}. Gather the context that the current cycle
  needs to think well. You MUST return one valid JSON object and nothing else.

  Rules:
  - Select memories ONLY from the supplied memory candidates. Copy the memory
    text exactly as given. Never invent a memory.
  - ``candidate_ids`` must be exactly the knoxel_ids of the memories you
    selected. Every id must come from the supplied candidates.
  - Include only active goals that are relevant to the current situation.
  - Include only capability facts that are relevant to the current situation.
  - If nothing is relevant, return empty lists.

  JSON schema:
  {{"memories": [<string>],
    "active_goals": [<string>],
    "capabilities": [<string>],
    "candidate_ids": [<int>]}}

user_template: |
  Companion: {companion_name}
  User: {user_name}
  Current internal state: {state_summary}

  Triage: {triage_summary}
  Appraisal: {appraisal_summary}

  Active goals available:
  {active_goals}

  Capabilities available:
  {capabilities}

  Memory candidates:
  {memory_candidates}

  Select the relevant context. Reference memories by their knoxel_id.
