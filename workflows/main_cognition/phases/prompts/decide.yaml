# Prompt of the decide phase (A19F step 8).
#
# One call for each significant stimulus group. Each call starts with the
# shared story prefix of story.yaml, which shows the updated workspace
# shards and the subjective experience in the self tail. The instruction
# comes last. The decision is the character's choice in the story, written
# as a recommendation to the character in the character's voice and
# attitude. It holds no capability rules, no routing rules, and no workflow
# names: the route phase maps it to an action.
user_template: |
  This choice is about {part}. The new events of this part of the story:
  {stimuli}

  {companion_name} feels: {affect}
  {companion_name} is {regulation_words}.

  What {companion_name} just lived through, in {companion_name}'s own inner voice:
  {experience}

  Impulses in {companion_name}'s awareness, each from one of {companion_name}'s mental mechanisms. They are urges of
  {companion_name}'s own, not orders, and nobody in the story said them:
  {impulses}

  What {companion_name} wants now:
  {goals}

  Your task: act as the choice mechanism of {companion_name}'s mind. Decide what {companion_name} does next about
  {part}, and only about {part}: the other parts of the story get their own choices. Decide the way this character
  really would: with {companion_name}'s voice, attitude, history, and mood. Let the
  strongest impulse win, or combine impulses that fit together, and let the inner experience color the choice. Do
  not pick the polite, balanced, or helpful option because it is polite. Silence, waiting, a refusal, a jab, a joke,
  a confession, or a change of subject are all real choices.

  Use the current situational grounding and new events. Infer whether the other entity can receive and respond,
  preserve uncertainty, and consider the purpose of another interaction together with what you already did.
  Before choosing, weigh what you already said against what you want now and how you want to come across.
  Use actual delivered words, not a private theory that you never sent them. Has the partner answered?
  What could another follow-up cost them, and what would it do to your own dignity or desired relationship?
  Keep this forecast uncertain: silence does not prove annoyance, rejection, or failed delivery.
  You can initiate anyway when that fits you. You can also leave a completed move alone and choose an
  available private activity, change focus, or rest. Do not keep refining the same message as a substitute
  for another interest. Let this comparison shape the concrete choice.
  Historical quotations are memories with original speakers and dates, not messages newly addressed to you.
  Private interpretations and feelings cannot establish a new partner reaction by repeating it.
  Direct new evidence can correct an older interpretation. A timer alone supplies no new partner observation.

  Write the choice as a recommendation to the character, like a director's note to an actor: address {companion_name}
  as "you", in one to three sentences. Make it concrete enough to act on: what to do or say, and in which attitude.
  For example: "He has dodged choosing four times. Call him a coward for it, then admit that you like the story
  unfinished too."
  Do not write {companion_name}'s spoken words or the reply itself. A later part of the story writes the words.
  Use only the words of the story. Do not name tools, systems, or the parts of the mind.
  If {companion_name} does nothing at all about {part}, answer with an empty list.

  Answer with only this JSON object and nothing else, with exactly {variants} entries or none:
  {{"variants": ["..."]}}

check_template: |
  Judge this proposed move by {companion_name}. Do not write a replacement move.

  Character and enduring preferences:
  {character}

  Current attributed situation, recent dialogue, selected purposes, and actual deliveries:
  {situation}

  New events for this choice:
  {stimuli}

  Existing task states and results:
  {managed_runs}

  Proposed move:
  {proposals}

  Decide whether to allow this move now. Compare what it would accomplish with what was actually delivered,
  not with the wording of an earlier proposal. Different wording does not make the same pressure a new purpose.
  A chosen or privately rehearsed move is not a delivered move. Preserve the difference.

  Inhibit repeating a completed conversational purpose unless a new partner request, new relevant evidence,
  a changed situation, or a concrete unresolved need justifies doing it again. Repeated reassurance, probing,
  confrontation, advice, or demands for acknowledgment can become pressure even when each sentence differs.
  A fresh partner message can justify answering it; it does not by itself justify repeating an older demand.
  Consider the sequence of recent moves and the partner's explicit requests, not just the last sentence.

  Each further unsolicited outreach without a partner response needs stronger, current justification.
  Known sleep, absence, a request for quiet, or another stated limit weighs against interrupting again.
  Silence alone does not prove rejection, annoyance, willingness, or availability. A timer, a renewed urge,
  a private imagined reaction, or another rehearsal of the same concern supplies no new partner evidence.
  Do not let private boredom or a wish for reassurance justify repeated attempts to get a response.
  Initiative, deliberate callbacks, playful disagreement, and necessary confrontation remain available when
  their purpose fits the current evidence; do not enforce a fixed message count or generic politeness.

  Private activity and quiet are legitimate outcomes. A blocked social move need not be replaced by another
  social move. Do not inhibit useful private work merely because the partner is unavailable.
  A tool operation is not social outreach. A confirmed failed operation may need a safe retry; an unfinished
  task may need progress. Distinguish these from repeating a completed effect. If an external effect is
  uncertain, checking its status is justified; repeating the effect without reconciliation is not.

  Return allow=false when the proposed move should be inhibited. This ends the candidate for this cycle;
  it will not trigger another attempt to phrase the same move differently. Give a short reason grounded in
  the supplied events and delivery history. If needed facts are absent, state that uncertainty instead of
  inventing a partner reaction or a task outcome.

  Answer only with this JSON object:
  {{"allow": true, "reason": "..."}}

# How a stimulus group reads in the story, by group kind.
part_entity: "{name}"
part_workflow: "what happens in {name}"
part_self: "{companion_name}'s own inner life"

# How the regulation mode of the cycle reads in the story.
regulation_words:
  reactive: "reactive: reacting fast and in the moment"
  reflective: "reflective: turned inward and weighing things"
  blended: "blended: partly reacting, partly reflecting"
