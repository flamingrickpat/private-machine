# Prompts of the codelets phase (A19F step 5).
#
# Every codelet call of one cycle starts with the shared story prefix of
# story.yaml (system prompt, story, acknowledgement). The phase renders it
# once per cycle, so the bytes are equal and the provider can reuse the
# cached prefix. The codelet's view of the CSM and its instruction come last.
#
# Frame: an expert story writer who simulates the mind of a character. Port
# of AgentSimpleCodelet and AgentSelectCodelets from private-machine-head.
# No capability or routing rules belong here.
view_template: |
  Here are the thoughts and impressions that are active in {companion_name}'s mind at this moment. Other mental
  mechanisms produced some of them, with a different focus than yours. Build on them, or go another way if the
  story needs it. Each line starts with its id.
  ### BEGIN MIND
  {view}
  ### END MIND

job_template: |
  Your task: act as one mental mechanism of {companion_name} and simulate what happens in their mind right now.
  Mechanism: {codelet_name}
  Description: {description}
  Instructions:
  {instructions}

  Express this mechanism's concern at full strength. Do not soften it, do not balance it against other concerns,
  and do not worry that it is too harsh, too petty, or too strange. Other mechanisms of the mind supply the balance.
  Write a recommendation for the character {companion_name} in this story: what {companion_name} feels, thinks,
  and wants to do or say next, from this one concern. Write prose only, in the third person, 2 to 4 sentences.

conversion_template: |
  Very nice. I want to keep track of all possible story paths, so please put the result of your analysis into JSON.
  I defined a few possible percept types for easy categorization. Fill as many of them as fit, at least one.
  Write the text fields as story prose about {companion_name}.
  {schema}

  Also fill:
  - "target": the part of the story that your result concerns. Use exactly one of: {targets}.
  - "about_ids": the ids of the lines in the MIND list above that your result is about. Use only ids from that
    list. An empty list is allowed.

  Answer with only this JSON object and nothing else:
  {{"target": "self", "about_ids": [], "<PerceptType>": {{"salience": 0.8, "valence": -0.4, "appraisal_general": {{"goal_congruence": -0.5}}, "appraisal_social": {{}}, "<text field>": "..."}}}}
  Each percept type is a key at the top level of this object, next to "target" and "about_ids".

selector_template: |
  I have a list of mental mechanisms that can shape what {companion_name} feels and does next in this story. The
  list is long, so act as a selector. Rate each mechanism from 0 to 1: how strongly it should shape
  {companion_name}'s mind at this exact moment of the story. 1 means it must speak now. 0 means it has nothing to
  add now.

  Mechanisms:
  {candidates}

  Answer with only this JSON object and nothing else, with one entry for each mechanism name:
  {{"ratings": {{"<mechanism name>": 0.0}}}}
