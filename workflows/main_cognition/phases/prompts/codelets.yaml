# Prompts of the codelets phase (A19F step 5).
#
# Every codelet call of one cycle starts with the shared story prefix of
# story.yaml (system prompt, story, acknowledgement). The phase renders it
# once per cycle, so the bytes are equal and the provider can reuse the
# cached prefix. The codelet's view of the CSM and its instruction come last.
#
# Frame: an expert story writer who simulates the mind of a character. Port
# of AgentSimpleCodelet and AgentSelectCodelets from private-machine-head.
# No capability or routing rules belong here.
view_template: |
  Here are the thoughts and impressions that are active in {companion_name}'s mind at this moment. Other mental
  mechanisms produced some of them, with a different focus than yours. Build on them, or go another way if the
  story needs it. Each line starts with its id.
  ### BEGIN MIND
  {view}
  ### END MIND

job_template: |
  Your task: act as one mental mechanism of {companion_name} and simulate what happens in their mind right now.
  Mechanism: {codelet_name}
  Description: {description}
  Instructions:
  {instructions}

  Find the cue for this particular concern in the supplied story. Who did, felt, owned or offered what?
  Being assigned this mechanism supplies no evidence that its cue occurred.

  If the cue is absent, let the concern stay quiet. Return one short third-person sentence restating a literal
  fact in the current scene. Preserve the speaker, action and tense. Add no detail, feeling, interpretation or
  course of action. Stop there.

  If the cue is present, imagine {companion_name}'s present private reaction at full strength. Other mechanisms
  supply the balance. A thought can be petty, tender, ugly or strange. Make it vivid with the supplied detail,
  a metaphor or an impulse. The present reaction and a possible next move are yours to invent. The past and
  the outside world belong to the story already given. Use a memory or someone's habitual gesture only when that
  particular episode or habit appears in the supplied material. Keep a report as something heard, a possibility
  as something imagined, and a wish as something still undone. Write two to four sentences of third-person prose.

conversion_template: |
  Very nice. I want to keep track of all possible story paths, so please put the result of your analysis into JSON.
  I defined a few possible percept types for easy categorization. Fill as many of them as fit, at least one.
  Write the text fields as story prose about {companion_name}.
  {schema}

  Convert only what the preceding recommendation actually says. The earlier scene identifies sources.
  It supplies no additional feeling, decision or plan to fill out the JSON.

  A single sentence that simply restates a fact is this mechanism's quiet result. Use exactly one of the offered
  types. Give that percept salience 0 and valence 0, with both appraisal maps empty. Put the literal fact in
  its text and leave other fields empty wherever the schema permits. If a required feeling or decision field has
  no value in the recommendation, say "none expressed". A mechanism's name is never evidence of its feeling.

  For an active recommendation keep its people, intensity, tense and uncertainty. Use the percepts and ratings
  its actual content warrants. A wish remains a wish and an idea remains a possibility.

  Also fill:
  - "target": the part of the story that your result concerns. Use exactly one name from this list: {targets}.
    No other name is valid. When your result is about a character that is not in the list, use "self". Use
    "self" also for a result about {companion_name} alone. When the moment holds several characters or a
    world, choose the one listed part that the result is most about, and write the percept texts about that
    part only: the mind keeps each relationship in its own place.
  - "about_ids": the ids of the lines in the MIND list above that your result is about. Use only ids from that
    list. An empty list is allowed.

  Answer with only this JSON object and nothing else:
  {{"target": "self", "about_ids": [], "<PerceptType>": {{"salience": 0.8, "valence": -0.4, "appraisal_general": {{"goal_congruence": -0.5}}, "appraisal_social": {{}}, "<text field>": "..."}}}}
  Each percept type is a key at the top level of this object, next to "target" and "about_ids".

selector_template: |
  I have a list of mental mechanisms that can shape what {companion_name} feels and does next in this story. The
  list is long, so act as a selector.

  In "patterns", name what the people in the scene actually did or said and what changed in the newest turn.
  A repeated event needs distinct occurrences. A trait or motive needs evidence of its own. An ordinary moment
  can stand alone. One or two sentences usually suffice.

  Pick out the few mechanisms whose cues you can point to in this scene. Score those directly, then fill
  every remaining name with 0 in one pass. Equal ratings are fine. A plain practical exchange can have
  very few matches. Give a plainly present cue its full weight, even if it conflicts with {companion_name}'s
  mood. Keep each feeling with its owner. A clear stop closes the earlier invitation. Ordinary companionship
  can stay platonic. Desire is a strong match when the character or the exchange gives it a real cue.

  {echoes}
  Mechanisms:
  {candidates}

  Answer with only this JSON object and nothing else, with one entry for each mechanism name:
  {{"patterns": "...", "ratings": {{"<mechanism name>": 0.0}}}}

# Added to the selector prompt when earlier lines of the same speaker come close to the newest line.
# Python finds these lines by embedding similarity (phases/codelets.py, echoes).
echo_template: |
  These earlier lines of the recent story say nearly the same as the newest line. The same move has come
  around {count} times before:
  {lines}

