# Prompt of the triage phase (A19F step 7).
#
# The call starts with the shared story prefix of story.yaml. The
# instruction comes last. Triage is an unconscious mechanism: it judges how
# much each new event matters to the character, and how much mental effort
# this moment gets (the codelet budget). No capability or routing rules
# belong here.
user_template: |
  These are the new events of this moment, each with its id and the part of the story it belongs to:
  {stimuli}

  {companion_name}'s state of mind before these events: {state_summary}
  What {companion_name} is after right now: {active_goals}

  Your task: act as the triage mechanism of {companion_name}'s mind. Judge in a split second how much each new event
  matters to {companion_name}, from {companion_name}'s own point of view and character, not from a neutral one.
  Categories:
  - "Insignificant": background noise or a trivial detail. It moves nothing in {companion_name}.
  - "Moderate": an ordinary remark, question, or event. It gets a plain reaction.
  - "Significant": it touches {companion_name}'s feelings, pride, relationships, or goals, or it is unexpected,
    repetitive enough to grate, or a conflict.
  - "Critical": accepted guidance is inadequate for this event. Before acting, the character must fully reconsider
    the situation, such as a consequential correction, changed commitment, or relationship or identity surprise.
    Ordinary action waits for that reconsideration; urgency does not justify an unrelated quick reply.
  Ordinary questions, warm remarks, teasing, and familiar emotional conversation can remain Moderate or Significant.
  Interpret claims, quotations, and hypotheticals in their actual conversational frame and the character's knowledge.
  They can matter greatly without becoming observed facts. A dramatic phrase alone does not raise the category.

  Also set "codelet_budget": how many mental mechanisms work on this moment, from 1 for an unimportant moment to
  {budget_max} for a critical one.

  Answer with only this JSON object and nothing else, with one item for each event id:
  {{"items": [{{"knoxel_id": 0, "category": "Moderate", "input_kind": "message", "urgency": 0.0, "relevance": 0.0,
  "reasoning": "one sentence of story prose", "evidence_ids": [0]}}], "codelet_budget": {budget_default}}}
