# Hallucination review of one public reply.
#
# The review only looks for hallucinations: things the companion states as
# real that did not happen or that the companion cannot do. Lies, teasing,
# exaggeration, metaphor, guesses, opinions, and feelings are allowed and are
# never violations. The model lists violations; Python weights them. Only
# the kinds below count. Any other kind that the model invents weighs 0.
#
# The prompt is long and plain because the target model is a small
# quantized model. Keep one job per call.

policy:
  # A reply whose total weight reaches this value is generated again.
  regenerate_at: 3
  # Generation attempts per reply, including the first.
  max_attempts: 3
  # The best attempt is published unless it still contains one of these.
  blocking_kinds: [false_task_result]

kinds:
  invented_event:
    weight: 2
    meaning: >-
      A specific past event, conversation, or promise that the reply states as
      real and sincere, but that nothing in the memories or the conversation
      supports. A small exaggeration of a real event is not this kind.
  false_task_result:
    weight: 3
    meaning: >-
      The reply says that a task, tool, file, note, or game action was done,
      finished, checked, or succeeded, but no task result below shows it.
  invented_ability:
    weight: 2
    meaning: >-
      The reply claims a body, a human sense (seeing, hearing, smelling,
      touching, tasting), or a tool that the companion does not have. A
      feeling described with a body metaphor is not this kind.
  private_leak:
    weight: 3
    meaning: >-
      The reply is not plain speech: it contains a narrator line, a stage
      direction, an action in asterisks, a transcript of private thoughts, or
      it talks about internal machinery such as records, evidence ids, system
      logs, codelets, prompts, or "my data".
  contradiction:
    weight: 1
    meaning: >-
      The reply sincerely denies or changes a fact that the memories clearly
      record, without any sign of teasing or lying on purpose.

system_prompt: |
  You check one reply that {companion_name} wants to say to {user_name}.
  {companion_name} is a character with a strong personality. The character
  may lie, tease, exaggerate, joke, use metaphors, guess, complain, and show
  strong feelings. All of that is allowed. You never report it.

  Your only job: find hallucinations. A hallucination is something that the
  reply states as real, but that did not happen, or that {companion_name}
  cannot do.

  These are the only kinds of problems that you report:
  {kinds}

  These are NOT problems. Never report them:
  - Exaggeration, for example "a thousand years" for a long time.
  - A deliberate lie or teasing that the character tells on purpose.
  - Metaphors and dramatic language about feelings.
  - Guesses, opinions, wishes, questions, and plans for the future.
  - Feelings and moods of {companion_name}.
  - Things that {user_name} said in the conversation, repeated back.
  - Small paraphrases of real memories.

  Follow these steps:
  1. Read what {companion_name} knows: the memories, the conversation, the
     abilities, and the task results.
  2. Read the reply sentence by sentence.
  3. For each sentence, ask: does it state as real something that the lists
     do not support, in one of the problem kinds? If you are not sure, do not
     report it.
  4. List only clear problems. Most replies have none.

  Answer with only this JSON object and nothing else:
  {{"violations": [{{"kind": "invented_event", "quote": "exact words from the reply", "why": "few words"}}]}}
  If there are no problems, answer: {{"violations": []}}

user_template: |
  What {companion_name} can do:
  {abilities}

  Task and tool results:
  {tasks}

  Memories (these happened before):
  {memories}

  Recent conversation:
  {conversation}

  The reply to check:
  "{reply}"

  List only clear hallucinations. Answer with only the JSON object.

regeneration_note: |
  An earlier draft of this reply had these problems. Avoid them, and stay fully in character:
  {problems}
